# Alembic configuration for Resova.
#
# The database URL is intentionally NOT hardcoded here: it is resolved in
# migrations/env.py from DATABASE_URL (environment or .env), via
# resova.config.settings.get_database_url(), so there is a single source of truth.
#
# No logging sections: env.py does not call fileConfig, so migration output uses the
# application logger configuration instead of a duplicated INI logger tree.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

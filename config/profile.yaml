      - Plumbing Drawings
      - Ductwork
      - AutoCAD 2D
      - BOQ
      - Quantity Takeoff
      - Material Submittals
      - Technical Reports
      - Engineering Documentation
      - Technical Office
      - Production Engineering
      - Mechanical Engineering
    # PROPOSED ONLY - the exact list sent to the client for approval (OQ-6).
    keywords_ar_proposed:
      - text: مكافحة حريق
        approved: false
      - text: إنذار حريق
        approved: false
      - text: رش آلي
        approved: false
      - text: شبكة إطفاء
        approved: false
      - text: تكييف وتهوية
        approved: false
      - text: رسومات تنفيذية
        approved: false
      - text: شوب دروينج
        approved: false
      - text: أوتوكاد
        approved: false
      - text: حصر كميات
        approved: false
      - text: مقايسة
        approved: false
      - text: مضخات حريق
        approved: false

  - id: presentation_design
    label: Professional Presentation & Business Deck Design
    experience_years: 8
    keywords_en:
      - PowerPoint
      - Presentation Design
      - Business Presentation
      - Company Profile Deck
      - Pitch Deck
      - Investor Deck
      - Corporate Presentation
      - Technical Presentation
      - Slide Design
      - Slide Redesign
      - Presentation Formatting
      - Deck Redesign
      - PDF to PowerPoint
      - Report Presentation
      - Infographic Slides
    # PROPOSED ONLY - the exact list sent to the client for approval (OQ-6).
    keywords_ar_proposed:
      - text: تصميم عرض تقديمي
        approved: false
      - text: بوربوينت
        approved: false
      - text: بروفايل شركة

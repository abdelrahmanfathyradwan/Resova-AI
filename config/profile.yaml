# Resova - client profile (editable, no secrets, safe to commit).
#
# This file is the single source of truth for WHAT Resova looks for and HOW it scores
# opportunities. Nothing here is hardcoded in Python.
#
# Rules encoded here:
#   * Arabic keywords are only PROPOSED by the engineer (approved: false). Unapproved
#     Arabic keywords are never used for matching until the client sets approved: true.
#   * unconfirmed_skills are named in the signed proposal but are NOT part of the client
#     profile. They are excluded from matching and drafting until the client sets
#     confirmed: true.

version: 1

# Target job titles the engineer applies for (matching hints only, not exclusions).
titles:
  - Mechanical Engineer
  - Fire Protection & MEP Engineer
  - Technical Office Engineer
  - Production Engineer
  - Professional Presentation & CV Designer

# Working languages of the engineer.
languages:
  - ar
  - en


# Candidate tracks that exceed the written profile. NOT used by matching until the
# client approves them (OQ-9).
proposed_tracks:
  - id: architectural_cad_boq
    label: Architectural Drafting, CAD & BOQ
    approved: false
    rationale: >-
      Accepted examples exceed the written profile (architectural drafting, CAD and
      BOQ work). Pending client approval before it can be used by matching.

# Domains to steer the AI away from and penalise softly. NOT hard keyword exclusions,
# and only applied once the client approves them (OQ-12).
out_of_scope_domains:
  - id: architecture_landscape_interior_finishing
    label: Architecture / landscape / interior design / finishing-materials consultation
    approved: false
  - id: software_automation_development
    label: Software / automation development (incl. n8n / AI tooling), even when the deliverable is a presentation
    approved: false
  - id: weapons_firearms
    label: Weapons / firearms / ammunition components
    approved: false

# Skills named in the signed proposal but NOT in the client profile. Excluded from
# matching and drafting until the client sets confirmed: true (see OQ-5).
unconfirmed_skills:
  - id: architectural_design
    label: Architectural Design
    confirmed: false
  - id: structural_drawings
    label: Structural Drawings
    confirmed: false
  - id: electrical_plumbing_drawings
    label: Electrical & Plumbing Drawings
    confirmed: false
  - id: quantity_surveying
    label: Quantity Surveying
    confirmed: false
  - id: pdf_document_processing
    label: PDF & Document Processing
    confirmed: false
  - id: professional_documents
    label: Professional Documents
    confirmed: false

settings:
  min_match_score: 70
  score_bands:
    strong: 85
    good: 70
    weak: 50
  notify_language: ar
  # TODO(client): keywords that must always disqualify a project (OQ-8).
  excluded_keywords: []
  # Budget is NEVER an exclusion criterion; these two are informational only.
  # TODO(client): confirm if any preference exists.
  min_budget: null
  preferred_duration: null
